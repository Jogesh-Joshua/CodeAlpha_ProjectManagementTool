<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Plan together. Build better. Move forward.</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    /* ── Landing page inline styles (placeholder until Phase 7 polish) ── */
    body {
      background: var(--orbit-slate-900, #0F1117);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #5B5BD6 0%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1.25rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 3rem;
    }
    .cta-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.85rem 2rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #5B5BD6;
      color: #fff;
      border: none;
    }
    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.75);
      border: 1.5px solid rgba(255,255,255,0.2);
    }
    footer {
      position: fixed; bottom: 1.5rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="logo">🌌 Orbit</div>
  <p class="tagline">Plan together. Build better. Move forward.</p>
  <div class="cta-group">
    <a class="btn btn-primary" href="/pages/auth.html?mode=register">Get Started Free</a>
    <a class="btn btn-ghost"   href="/pages/auth.html?mode=login">Sign In</a>
  </div>
  <footer>CodeAlpha Full Stack Internship — Task 3</footer>
</body>
</html>
