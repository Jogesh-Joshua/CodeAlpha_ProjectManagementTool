<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Plan together. Build better. Move forward.</title>
  <script>
    (function() {
      var t = localStorage.getItem('orbit-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    /* ── Landing page inline styles (placeholder until Phase 7 polish) ── */
    body {
      background: var(--theme-bg, #0F1117);
      color: var(--theme-text-primary, #fff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .landing-theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 20;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #5B5BD6 0%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1.25rem;
      color: var(--theme-text-secondary, rgba(255,255,255,0.6));
      margin-bottom: 3rem;
    }
    .cta-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.85rem 2rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #5B5BD6;
      color: #fff;
      border: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--theme-text-primary, rgba(255,255,255,0.75));
      border: 1.5px solid var(--theme-border-strong, rgba(255,255,255,0.2));
    }
    [data-theme="light"] .btn-ghost {
      background: #FFFFFF;
      color: #334155;
      border-color: #CBD5E1;
    }
    footer {
      position: fixed; bottom: 1.5rem;
      color: var(--theme-text-muted, rgba(255,255,255,0.3));
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="landing-theme-toggle">
    <button id="theme-toggle" class="btn-theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"></button>
  </div>
  <div class="logo">🌌 Orbit</div>
  <p class="tagline">Plan together. Build better. Move forward.</p>
  <div class="cta-group">
    <a class="btn btn-primary" href="/pages/auth.html?mode=register">Get Started Free</a>
    <a class="btn btn-ghost"   href="/pages/auth.html?mode=login">Sign In</a>
  </div>
  <footer>CodeAlpha Full Stack Internship — Task 3</footer>
  <script src="/js/theme.js"></script>
</body>
</html>
